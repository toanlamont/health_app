name: health_app
description: "HeartBeat - Health monitoring app with PPG heart rate measurement"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.12.0
  screen_brightness: ^2.1.2
  dio: ^5.7.0
  flutter_bloc: ^9.1.0
  go_router: ^14.8.0
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
